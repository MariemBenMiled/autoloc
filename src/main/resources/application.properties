spring.application.name=autoloc-api

# Connexion à la base de données (on utilise spring_app car elle existe déjà chez vous)
spring.datasource.url=jdbc:mysql://localhost:3306/spring_app?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=8081